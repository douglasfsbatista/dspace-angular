<section class="home-video-section mt-3">

  <div class="container">

    <h2 class="home-video-title">
      Centro de Referência da Educação de
      Jovens e Adultos (CREJA)
    </h2>

    <div class="video-wrapper">
      <div class="video-container">
        <iframe
            [src]="videoUrl"
            title="Vídeo CREJA"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
      </div>
    </div>

  </div>

</section>
