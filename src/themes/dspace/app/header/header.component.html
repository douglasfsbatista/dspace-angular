<!-- HEADER SUPERIOR (BRANCO) -->
<header id="social-header"
        class="py-3"
        style="background-color:#FFFFFF; color:black; --bs-link-color:#000; --bs-link-hover-color:#000;">

  <div class="container">
    <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">

      <!-- LOGO DINÂMICA -->
      <a class="d-inline-flex align-items-center"
         routerLink="/home"
         [attr.aria-label]="'home.title' | translate">

        <img id="header-logo"
             [src]="config.logo"
             alt="CREJA Logo"
             class="img-fluid d-block">
      </a>

      <div role="menubar"
           aria-label="Ações do cabeçalho"
           class="d-flex align-items-center flex-wrap justify-content-center justify-content-md-end gap-2">

        <ds-lang-switch></ds-lang-switch>
        <ds-context-help-toggle></ds-context-help-toggle>
        <ds-impersonate-navbar></ds-impersonate-navbar>
        <ds-auth-nav-menu></ds-auth-nav-menu>

      </div>

    </div>
  </div>
</header>


<!-- NAVBAR PRINCIPAL -->
<header class="py-1 site-nav"
        [style.background-color]="config.color"
        style="color:#fff;">

  <nav class="container" aria-label="Menu principal">

    <div class="d-flex align-items-center justify-content-between">
      <span class="d-lg-none"></span>

      <!-- Botão hamburguer -->
      <button
        type="button"
        class="navbar-toggler d-inline-flex d-lg-none align-items-center"
        aria-label="Abrir menu"
        (click)="toggleNav()"
        [attr.aria-expanded]="isNavOpen">

        <span class="hamburger" [class.open]="isNavOpen">
          <span></span><span></span><span></span>
        </span>

      </button>
    </div>

    <!-- MENU -->
    <div class="custom-nav nav-collapsible d-lg-flex"
         [class.open]="isNavOpen"
         (click)="closeNav()">

      <!-- MENU DINÂMICO -->
      <a class="nav-link"
         [routerLink]="config.home"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <a class="nav-link"
         [routerLink]="config.sobre"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Sobre
      </a>


      <!-- MENU NORMAL -->
      <ng-container *ngIf="currentCommunity !== 'crejao'">

        <a class="nav-link"
          [routerLink]="config.collections?.pesquisas"
          routerLinkActive="active">
          Pesquisas e Memórias
        </a>

        <a class="nav-link"
          [routerLink]="config.collections?.praticas"
          routerLinkActive="active">
          Práticas Alfabetizadoras
        </a>

        <a class="nav-link"
          [routerLink]="config.collections?.vozes"
          routerLinkActive="active">
          Vozes da EJA
        </a>

        <a class="nav-link"
           routerLink="/redes"
           routerLinkActive="active">
          Redes
        </a>

      </ng-container>


      <!-- MENU CREJÃO -->
      <ng-container *ngIf="currentCommunity === 'crejao'">

        <a class="nav-link"
           routerLink="/paulo-freire-home"
           routerLinkActive="active">
          CREJA Paulo Freire
        </a>

        <a class="nav-link"
           routerLink="/ipf-home"
           routerLinkActive="active">
          CREJA Instituto Paulo Freire
        </a>

        <a class="nav-link"
           routerLink="/home"
           routerLinkActive="active">
          CREJA ALFA-EJA Brasil
        </a>

        <a class="nav-link"
           routerLink="/redes-creja"
           routerLinkActive="active">
          Redes
        </a>

      </ng-container>

      <!-- FIXO -->
      <a class="nav-link"
         routerLink="/ajuda-alfa-eja"
         routerLinkActive="active">
        Ajuda
      </a>

    </div>

  </nav>
</header>
