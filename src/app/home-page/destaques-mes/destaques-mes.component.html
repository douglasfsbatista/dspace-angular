<div class="destaques-mes-container">
  <div class="row g-4">
    <div class="col-6 col-sm-4 col-md-3" *ngFor="let item of destaquesMes">
      <a [routerLink]="['/items', item.id]" class="card-link">
        <div class="card destaque-card">
          <img
            [src]="item.thumbnail"
            [alt]="item.title"
            class="card-img-top"
          >
          <div class="card-body">
            <h5 class="card-title">{{ item.title }}</h5>
            <p class="card-text">
              {{ item.resumo }}
            </p>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
