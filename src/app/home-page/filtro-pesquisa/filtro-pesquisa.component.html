<div class="filter-container container-fluid px-3 px-sm-4">
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let filter of filtros">
      <div class="card h-100 shadow-sm">
        <button
          type="button"
          class="card-header text-white d-flex justify-content-between align-items-center w-100 bg-brand border-0"
          (click)="toggle(filter)"
          [attr.aria-expanded]="filter.aberto"
        >
          <span class="me-2">{{ filter.nome }}</span>
          <span [class]="filter.aberto ? 'bi bi-dash' : 'bi bi-plus'"></span>
        </button>

        <div *ngIf="filter.aberto" class="list-group list-group-flush">
          <button
            type="button"
            *ngFor="let opcao of filter.opcoes"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            title="{{ opcao.nome }}"
          >
            <span class="text-truncate me-2">{{ opcao.nome }}</span>
            <span class="badge bg-light text-dark rounded-pill">{{ opcao.qtd }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
